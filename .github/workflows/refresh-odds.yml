# Drop this file in your GitHub repo at:
#   .github/workflows/refresh-odds.yml
# GitHub → repo → Actions must be enabled.
# Edit APP_URL if your Streamlit address changes.

name: Girl Magic keep-alive fetch

on:
  schedule:
    # every 20 minutes
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake Streamlit and fetch NFL
        run: |
          curl -fsS -L --max-time 90 \
            "https://girlmagic-iio79pkygnfeqzrrx3r4bj.streamlit.app/?sport=NFL&autofetch=1" \
            -o /tmp/nfl.html || true
      - name: Wake Streamlit and fetch MLB
        run: |
          curl -fsS -L --max-time 90 \
            "https://girlmagic-iio79pkygnfeqzrrx3r4bj.streamlit.app/?sport=MLB&autofetch=1" \
            -o /tmp/mlb.html || true
      - name: Confirm pages came back
        run: |
          wc -c /tmp/nfl.html /tmp/mlb.html || true
